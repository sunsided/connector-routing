[package]
name = "connector-routing"
description = "Global connector routing: many orthogonal connectors at once with bend, length and crossing costs, negotiated congestion and rip-up and reroute"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/connector-routing"
readme = "README.md"
keywords = ["routing", "orthogonal", "pathfinding", "diagram", "planning"]
categories = ["algorithms", "graphics", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
# Single-connector A*. Path dependency on the sibling draft; must become a crates.io
# version before this crate is published (see docs/design.md).
heuristic-search = { path = "../heuristic-search", version = "0.0.0" }
# Pareto-optimal single-connector routes (NAMOA*dr). Path dependency on the sibling draft.
multiobjective-search = { path = "../multiobjective-search", version = "0.0.0", optional = true }

[features]
## Pareto fronts over length, bends and crossings for one connector, via NAMOA*dr from
## `multiobjective-search`.
multi-objective = ["dep:multiobjective-search"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = "1.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bench]]
name = "routing"
harness = false
