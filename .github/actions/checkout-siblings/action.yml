# Checks out the sibling crates that path dependencies point at (`path = "../x"`), next to this
# crate's own checkout. Cargo fails on a missing path dependency even when it carries a version,
# so every job that runs cargo checks this repository out into `$GITHUB_WORKSPACE/connector-routing`
# first (a local action cannot run before the checkout that contains it), then uses this action.
# Only siblings that are still 0.0.0 placeholders on crates.io belong here; released siblings
# are plain crates.io dependencies. Remove a sibling once its dependency moves to a release.
name: Check out sibling repositories
description: Checks out the unreleased sibling crates next to the connector-routing checkout

inputs:
  token:
    description: Token with read access to the private sibling repositories (secret SIBLING_REPOS_TOKEN)
    required: true

runs:
  using: composite
  steps:
    # Private: single-connector A* (`heuristic-search`).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/heuristic-search
        path: heuristic-search
        token: ${{ inputs.token }}
        persist-credentials: false
    # Private: optional dependency behind feature `multi-objective`; CI builds --all-features.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sunsided/multiobjective-search
        path: multiobjective-search
        token: ${{ inputs.token }}
        persist-credentials: false
