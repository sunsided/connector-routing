[package]
name = "connector-routing-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.connector-routing]
path = ".."

[[bin]]
name = "route_scene"
path = "fuzz_targets/route_scene.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sleeve_route"
path = "fuzz_targets/sleeve_route.rs"
test = false
doc = false
bench = false

# A separate workspace, kept out of the root one (cargo-fuzz needs nightly).
[workspace]

# Mirrors the root lint table; `workspace = true` cannot reach a separate workspace.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

