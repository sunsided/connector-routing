[package]
name = "connector-routing-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.connector-routing]
path = ".."

[[bin]]
name = "route_scene"
path = "fuzz_targets/route_scene.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sleeve_route"
path = "fuzz_targets/sleeve_route.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline_draw"
path = "fuzz_targets/pipeline_draw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hyperedge_tree"
path = "fuzz_targets/hyperedge_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "polyline_route"
path = "fuzz_targets/polyline_route.rs"
test = false
doc = false
bench = false

# A separate workspace, kept out of the root one (cargo-fuzz needs nightly).
[workspace]

# Mirrors the root lint table; `workspace = true` cannot reach a separate workspace.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

